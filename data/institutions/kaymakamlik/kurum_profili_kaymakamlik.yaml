  - id: cevap_yazisi
    ad: "Cevap Yazısı"
    kullanim_durumu: "Gelen bir dilekçe/talebe yanıt verilmesi gerektiğinde"
    sablon: "templates/cevap_yazisi.jinja2"

  - id: bilgilendirme_yazisi
    ad: "Bilgilendirme Yazısı"
    kullanim_durumu: "Süreç hakkında ilgili tarafa ara bilgi verilmesi gerektiğinde"
    # Ayrı şablonu yok, ust_yazi kullanılır (TASARIM KARARI #6, bkz. templates/README.md)
    sablon: "templates/ust_yazi.jinja2"

  - id: tekit_yazisi
    ad: "Tekit Yazısı"
    kullanim_durumu: "Önceki yazıya yanıt gelmediğinde hatırlatma amaçlı"
    sablon: "templates/tekit_yazisi.jinja2"
