# ---------------------------------------------------------------------------
# 3. EVRAK TÜRLERİ
# ---------------------------------------------------------------------------
evrak_turleri:
  - id: dilekce
    ad: "Vatandaş Dilekçesi"
    aciklama: "3071 sayılı Kanun kapsamında genel talep/şikayet dilekçesi"
    yasal_dayanak: "3071 sayılı Dilekçe Hakkının Kullanılmasına Dair Kanun"
    required_fields:
      - person_name
      - address
      - signature_present
      - subject
      - request
    tipik_hedef_birim:
      - "yazi_isleri"
      - "zabita"
      - "fen_isleri"

  - id: bilgi_edinme
    ad: "Bilgi Edinme Başvurusu"
    aciklama: "4982 sayılı Kanun kapsamında bilgi/belge talebi"
    yasal_dayanak: "4982 sayılı Bilgi Edinme Hakkı Kanunu"
    required_fields:
      - person_name
      - address
      - signature_present
      - request
    tipik_hedef_birim:
      - "yazi_isleri"

  - id: ruhsat_basvurusu
    ad: "İşyeri Açma ve Çalışma Ruhsatı Başvurusu"
    aciklama: "Belediye sınırları içinde işyeri açmak için gerekli ruhsat"
    yasal_dayanak: "İşyeri Açma ve Çalışma Ruhsatlarına İlişkin Yönetmelik"
    required_fields:
      - person_name
      - address
      - signature_present
      - phone
      - request
    tipik_hedef_birim:
      - "zabita"
      - "mali_hizmetler"

  - id: imar_talebi
    ad: "İmar Durumu / Yapı Ruhsatı Talebi"
    aciklama: "Parsel bazlı imar durumu belgesi veya yapı ruhsatı başvurusu"
    yasal_dayanak: "3194 sayılı İmar Kanunu"
    required_fields:
      - person_name
      - address
      - signature_present
      - request
    tipik_hedef_birim:
      - "imar_sehircilik"

  - id: sikayet
    ad: "Şikayet Bildirimi"
    aciklama: "Belediye hizmetlerine yönelik şikayet bildirimi"
    yasal_dayanak: "5393 sayılı Belediye Kanunu Md. 77"
    required_fields:
      - person_name
      - address
      - signature_present
      - subject
      - request
    tipik_hedef_birim:
      - "yazi_isleri"
      - "zabita"
      - "fen_isleri"
      - "temizlik_isleri"

  - id: kurumlar_arasi_yazi
    ad: "Kurumlar Arası Resmî Yazışma"
    aciklama: "Başka bir kamu kurumundan gelen üst yazı/talep (ör. Kaymakamlık)"
    yasal_dayanak: "Resmî Yazışma Yönetmeliği"
    required_fields:
      - document_number
      - document_date
      - sender_unit
      - recipient
      - subject
      - signature_present
    tipik_hedef_birim:
      - "yazi_isleri"
      - "imar_sehircilik"
      - "fen_isleri"

# ---------------------------------------------------------------------------
# 4. YAZI TÜRLERİ — Şablon Eşleştirmesi (aynı şablonlar kullanılır)
# ---------------------------------------------------------------------------
yazi_turleri:
  - id: ust_yazi
    ad: "Üst Yazı"
    kullanim_durumu: "Başka bir kuruma resmi talep/bilgi iletimi gerektiğinde"
    sablon: "templates/ust_yazi.jinja2"

  - id: cevap_yazisi
    ad: "Cevap Yazısı"
    kullanim_durumu: "Gelen bir dilekçe/talebe yanıt verilmesi gerektiğinde"
    sablon: "templates/cevap_yazisi.jinja2"

  - id: bilgilendirme_yazisi
    ad: "Bilgilendirme Yazısı"
    kullanim_durumu: "Süreç hakkında ilgili tarafa ara bilgi verilmesi gerektiğinde"
    sablon: "templates/ust_yazi.jinja2"

  - id: tekit_yazisi
    ad: "Tekit Yazısı"
    kullanim_durumu: "Önceki yazıya yanıt gelmediğinde hatırlatma amaçlı"
    sablon: "templates/tekit_yazisi.jinja2"
