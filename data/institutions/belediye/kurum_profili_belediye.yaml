# 2. BİRİMLER
# ---------------------------------------------------------------------------
birimler:

  # --- Evrensel birimler (Kaymakamlık ile aynı id'ler) ---
  - id: yazi_isleri
    ad: "Yazı İşleri Müdürlüğü"
    aciklama: "Evrak kayıt, genel idare yazışmaları, meclis kararları, hukuk işleri"
    anahtar_kelimeler:
      - "dilekçe"
      - "genel başvuru"
      - "hukuk"
      - "meclis kararı"
      - "evrak kayıt"
      - "bilgi edinme"
    supported_intents:
      - "bilgi_talebi"
      - "belge_talebi"
      - "basvuru"
      - "sikayet"
      - "itiraz"
      - "izin_talebi"
      - "bildirim"
      - "cevap"
      - "iletim"
      - "diger"
    teams:
      - code: gelen_evrak_ve_yazisma
        name: "Gelen Evrak ve Yazışma Ekibi"
        roles: ["YAZI_ISLERI_UZMANI"]
      - code: bilgi_edinme
        name: "Bilgi Edinme Ekibi"
        roles: ["YAZI_ISLERI_UZMANI"]
      - code: sosyal_destek
        name: "Sosyal Destek Ön İnceleme Ekibi"
        roles: ["SOSYAL_INCELEME_UZMANI"]

  - id: hukuk_isleri
    ad: "Hukuk İşleri Müdürlüğü"
    aciklama: "Belediye davalarının takibi, hukuki görüş, itiraz süreçleri"
